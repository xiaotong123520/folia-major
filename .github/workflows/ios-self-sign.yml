name: Build iOS IPA for self-signing

on:
  push:
    branches: [build/ios-self-sign]
    paths:
      - 'packaging/ios/**'
      - '.github/workflows/ios-self-sign.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check server HTTPS entry
        run: |
          curl --fail --silent --show-error --location --max-redirs 3 --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 45 --retry 1 'https://music.xn--1lqq7iexp1vp.com/' -o /tmp/tingyu-home.html
          python3 -c "from pathlib import Path; p=Path('/tmp/tingyu-home.html'); s=p.read_text(); assert '<html' in s.lower() and len(s)>100, 'Expected an HTML website'; print('HTTPS entry returned HTML')"
      - name: Check native audio handoff bridge
        run: node --test packaging/ios/testNativeAudioBridge.cjs
      - name: Prepare app icon
        run: sips -z 1024 1024 public/icon-512.png --out packaging/ios/TingyuFM/Assets.xcassets/AppIcon.appiconset/AppIcon.png
      - name: Compile device archive without signing
        run: |
          set -o pipefail
          bash packaging/ios/build.sh 2>&1 | tee ios-build.log
      - name: Package compiled app for self-signing
        run: bash packaging/ios/packageUnsigned.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TingyuFM-iOS-1.1.1-server-unsigned
          path: |
            packaging/ios/output/TingyuFM-unsigned.ipa
            packaging/ios/output/SELF-SIGN.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-log
          path: ios-build.log
          if-no-files-found: ignore
