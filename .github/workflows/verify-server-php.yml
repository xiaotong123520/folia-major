name: PHP server music adapter checks

on:
  pull_request:
    paths:
      - 'deploy/php-music-api/**'
      - '.github/workflows/verify-server-php.yml'
      - 'src/services/onlineMusic/music-backend/musicBackendProvider.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax checks
        run: |
          php -l deploy/php-music-api/index.php
          php -l deploy/php-music-api/build-index.php
      - name: Search and HTTP byte-range integration smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ts-media/album" "$RUNNER_TEMP/ts-private"
          printf 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789' > "$RUNNER_TEMP/ts-media/album/Tester - Song.mp3"
          php deploy/php-music-api/build-index.php "$RUNNER_TEMP/ts-media" "$RUNNER_TEMP/ts-private/index.json"
          export MUSIC_LIBRARY_ROOT="$RUNNER_TEMP/ts-media"
          export MUSIC_LIBRARY_INDEX="$RUNNER_TEMP/ts-private/index.json"
          export MUSIC_PUBLIC_ORIGINS="https://xiaotong123520.github.io"
          export MUSIC_BACKEND_API_KEY="php-ci-not-a-real-secret"
          export MUSIC_BROWSER_READ_TOKEN="test-read-only-token-0123456789-abcdef"
          export MUSIC_STREAM_SIGNING_KEY="test-media-signing-secret-0123456789-abcdef"
          export MUSIC_BROWSER_ORIGINS="https://example.vercel.app"
          php -S 127.0.0.1:8092 -t deploy/php-music-api deploy/php-music-api/index.php > "$RUNNER_TEMP/ts-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..25}; do
            if curl -s --fail http://127.0.0.1:8092/healthz | grep -q ok; then break; fi
            sleep 0.2
          done
          curl -fsS -H "Authorization: Bearer $MUSIC_BACKEND_API_KEY" "http://127.0.0.1:8092/api/v1/music/search?q=Song" > "$RUNNER_TEMP/result.json"
          php -r '$r=json_decode(file_get_contents($argv[1]),true); if(($r["data"]["total"]??0)!==1 || ($r["data"]["songs"][0]["source"]??"")!=="local") exit(1);' "$RUNNER_TEMP/result.json"
          track_id=$(php -r '$r=json_decode(file_get_contents($argv[1]),true); echo $r["data"]["songs"][0]["id"];' "$RUNNER_TEMP/result.json")
          result=$(curl -sS -D "$RUNNER_TEMP/range-headers" -o "$RUNNER_TEMP/range-bytes" -w '%{http_code}' \
            -H "Authorization: Bearer $MUSIC_BACKEND_API_KEY" -H 'Range: bytes=0-4' "http://127.0.0.1:8092/api/v1/music/stream?source=local&id=$track_id")
          test "$result" = "206"
          grep -qi 'content-range: bytes 0-4/36' "$RUNNER_TEMP/range-headers"
          test "$(cat "$RUNNER_TEMP/range-bytes")" = "ABCDE"
          result=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $MUSIC_BACKEND_API_KEY" "http://127.0.0.1:8092/api/v1/music/stream?source=local&id=../../etc/passwd")
          test "$result" = "400"
          result=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $MUSIC_BACKEND_API_KEY" -H 'Range: bytes=99999-' "http://127.0.0.1:8092/api/v1/music/stream?source=local&id=$track_id")
          test "$result" = "416"
          result=$(curl -sS -D "$RUNNER_TEMP/cors-headers" -o /dev/null -w '%{http_code}' \
            -H 'Origin: https://xiaotong123520.github.io' \
            "http://127.0.0.1:8092/api/v1/music/search?q=Song")
          test "$result" = "200"
          grep -qi 'access-control-allow-origin: https://xiaotong123520.github.io' "$RUNNER_TEMP/cors-headers"
          # Read-only clients get a short-lived, signed URL instead of filesystem paths.
          curl -fsS -H "Authorization: Bearer $MUSIC_BROWSER_READ_TOKEN" \
            "http://127.0.0.1:8092/api/v1/music/search?q=Song" > "$RUNNER_TEMP/private-index.json"
          stream_path=$(php -r '$r=json_decode(file_get_contents($argv[1]),true); $url=$r["data"]["songs"][0]["streamUrl"]??""; if(!str_starts_with($url,"/api/v1/music/stream?")) exit(1); echo $url;' "$RUNNER_TEMP/private-index.json")
          result=$(curl -sS -D "$RUNNER_TEMP/signed-range-headers" -o "$RUNNER_TEMP/signed-range-body" -w '%{http_code}' \
            -H 'Range: bytes=5-9' "http://127.0.0.1:8092$stream_path")
          test "$result" = "206"
          test "$(cat "$RUNNER_TEMP/signed-range-body")" = "FGHIJ"
          result=$(curl -sS -o /dev/null -w '%{http_code}' \
            "http://127.0.0.1:8092/api/v1/music/stream?source=local&id=$track_id&expires=0000000000&sig=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa")
          test "$result" = "401"
          result=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Origin: https://example.vercel.app' -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: Authorization' -X OPTIONS \
            "http://127.0.0.1:8092/api/v1/music/search")
          test "$result" = "204"
