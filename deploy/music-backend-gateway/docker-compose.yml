services:
  go-music-api:
    image: guohuiyuan/go-music-api:latest
    container_name: folia-music-api
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - music-private
    # No host port is published. Cookie/QR-login administration is not exposed through the gateway.

  music-backend-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: folia-music-gateway
    restart: unless-stopped
    depends_on:
      - go-music-api
    environment:
      PORT: "8090"
      MUSIC_BACKEND_INTERNAL_URL: "http://go-music-api:8080"
      MUSIC_BACKEND_API_KEY: "${MUSIC_BACKEND_API_KEY:?Set a long random bearer key in .env}"
      GATEWAY_MAX_REQUESTS_PER_MINUTE: "120"
    ports:
      # Bind only to loopback; put Baota/Nginx/Caddy HTTPS in front of this port.
      - "127.0.0.1:8090:8090"
    networks:
      - music-private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  music-private:
    driver: bridge
